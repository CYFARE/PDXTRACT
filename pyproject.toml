[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdxtract"
version = "2.0.0"
description = "Professional PDF extractor powered by OCR + deterministic regex."
readme = "README.md"
license = {text = "GPL-2.0-only"}
requires-python = ">=3.10"
authors = [
    {name = "Cyfare"}
]
keywords = ["pdf", "ocr", "extraction", "email", "got-ocr", "ollama", "llama.cpp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "PyMuPDF>=1.24.0",
    "Pillow>=10.0.0",
    "ollama>=0.3.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
got = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.37.0",
    "accelerate>=0.28.0",
    "sentencepiece>=0.2.0",
    "protobuf>=3.20.0",
    "tiktoken>=0.6.0",
    "verovio>=4.3.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
pdxtract = "pdxtract.cli:main"

[tool.setuptools]
packages = ["pdxtract"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
